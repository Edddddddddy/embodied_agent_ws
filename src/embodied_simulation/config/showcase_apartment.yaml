schema_version: 1
world:
  name: voice_slam_nav_showcase
  bounds: {min_x: -5.0, max_x: 5.0, min_y: -4.0, max_y: 4.0}
  resolution: 0.05
  background: [0.93, 0.93, 0.90, 1.0]
  spawn: {x: -4.15, y: -3.15, yaw: 0.0}

# 可视动态障碍在建图时停在场景外，不写入静态地图。完整验收会在导航阶段
# 通过 Gazebo set_pose 将它移入路径，并同步发布 typed perception detections。
dynamic_obstacles:
  - {name: crossing_cart, shape: cylinder, x: -15.0, y: -15.0, radius: 0.28, height: 0.80, color: [0.92, 0.18, 0.12, 1.0]}

# 语义地点同时生成 Nav2 places.yaml；坐标必须位于无碰撞区域并留出底盘膨胀余量。
places:
  home: {label: 起点, x: -4.15, y: -3.15, yaw: 0.0}
  entrance: {label: 入口, x: -4.15, y: -0.20, yaw: 1.57}
  door: {label: 门口兼容点, x: -4.15, y: -0.20, yaw: 1.57}
  living_room: {label: 客厅, x: -2.80, y: -2.75, yaw: 1.57}
  kitchen: {label: 厨房, x: -2.70, y: 1.55, yaw: 1.57}
  hallway: {label: 走廊, x: 0.00, y: 0.00, yaw: 0.0}
  office: {label: 办公室, x: 2.50, y: 1.55, yaw: 1.57}
  desk: {label: 书桌兼容点, x: 2.50, y: 1.55, yaw: 1.57}
  meeting_room: {label: 会议区, x: 3.00, y: -3.10, yaw: 0.0}
  charging_station: {label: 充电区, x: -4.15, y: -3.45, yaw: 3.14}

# floor 只参与视觉渲染；wall/furniture/landmark 同时生成 Gazebo collision 与占据栅格。
