offline_agent:
  ros__parameters:
    # 公共会话/队列/记忆参数由 embodied_agent_core/agent_parameters.py 统一管理；
    # 本文件仅保留 ZipFormer、llama.cpp 与离线 TTS provider 的部署配置。
    asr_num_threads: 2
    # ZipFormer 在 input_finished 前需要尾部静音推出编码器剩余上下文，避免长句末尾漏字。
    asr_tail_padding_s: 0.66
    asr_decoding_method: modified_beam_search
    asr_hotwords_file: ""
    # 领域命令很短，适度提高上下文偏置可减少“取消导航->取消刀”等槽位错听。
    asr_hotwords_score: 3.0
    # 真实 10 秒长句回归中 4 条路径会过早剪枝，16 条可保留“星期三”等尾部词元。
    asr_max_active_paths: 16
    asr_modeling_unit: cjkchar
    recognition_max_retries: 3
    llm_base_url: "http://127.0.0.1:8080/v1"
    llm_model: "Qwen3-0.6B-Q8_0.gguf"
    llm_temperature: 0.7
    llm_max_tokens: 192
    llm_seed: 42
    llm_timeout_s: 30.0
    llm_max_retries: 1
    llm_first_token_warn_ms: 1000.0
    # 单用户端侧 Agent 在 ready 前预热公共 system prompt 和 TTS，避免首条命令承担冷启动。
    runtime_warmup_enabled: true
    # tts_provider=sherpa 是当前稳定默认值；切到 summer 时会调用
    # third_party/SummerTTS/build/tts_test，适合展示 C++ 离线 TTS runtime 接入。
    tts_provider: sherpa
    tts_num_threads: 2
    tts_speaker_id: 0
    tts_speed: 1.0
    tts_sample_rate: 44100
    tts_chunk_max_chars: 24
    tts_pcm_chunk_ms: 80
    summer_tts_timeout_s: 30.0
    summer_tts_service_name: "/tts/synthesize"
    summer_tts_service_timeout_s: 10.0
    summer_tts_service_speaker_id: -1
    summer_tts_service_length_scale: 0.0
    mock_token_delay_s: 0.0

audio_frontend:
  ros__parameters:
    capture_enabled: false
    speaker_enabled: false
    microphone_sample_rate: 16000
    reference_sample_rate: 44100
    frame_ms: 20
    vad_provider: energy
    endpoint_events_enabled: true
    vad_rms_threshold: 0.018
    metrics_period_s: 0.5
    silence_timeout_s: 0.4
    speech_end_silence_s: 0.4
    min_utterance_ms: 100.0
    max_utterance_s: 12.0
    audio_enhancer: nlms
    aec_enabled: true
    noise_suppression_enabled: false
    auto_gain_enabled: false
    aec_taps: 64
    aec_step: 0.35
    aec_delay_ms: 80

silero_vad:
  ros__parameters:
    enabled: true
    sample_rate: 16000
    frame_ms: 32
    threshold: 0.5
    speech_end_silence_s: 0.4
    min_utterance_ms: 100.0
    max_utterance_s: 12.0
    use_onnx: true
    model_path: ""
    input_queue_depth: 20
    publish_legacy_silence_timeout: true

keyword_wake:
  ros__parameters:
    mode: mock_text
    provider_name: mock_kws
    keywords: ["小智", "你好小智"]
    aliases: ["小志", "小治", "晓智", "晓志"]
    sample_rate: 16000
    cooldown_s: 1.0
    score_publish_period_s: 0.2
    input_queue_depth: 20
    sherpa_tokens: ""
    sherpa_encoder: ""
    sherpa_decoder: ""
    sherpa_joiner: ""
    sherpa_keywords_file: ""
    sherpa_num_threads: 1
    sherpa_provider: cpu
    openwakeword_models: [""]
    openwakeword_threshold: 0.5
    openwakeword_inference_framework: onnx
    # -1 表示不启用 openWakeWord 内置 Silero VAD gate；端点检测仍由项目 VAD seam 负责。
    openwakeword_vad_threshold: -1.0
    openwakeword_speex_noise_suppression: false
    livekit_wakeword_models: [""]
    livekit_wakeword_threshold: 0.5
