# 中文机器人语音控制错词归一化词表。
#
# 说明：
# - aliases 是确定性替换，适合 ASR 常见同音/近音错字。
# - canonical_phrases 是可参与模糊匹配的领域短语，避免普通聊天被过度改写。
# - 修改本文件后重新 colcon build，或通过 command_normalization_path 指向自定义文件。

aliases:
  # 唤醒词
  - [小志, 小智]
  - [小治, 小智]
  - [晓智, 小智]
  - [晓志, 小智]
  - [小只, 小智]
  - [小之, 小智]

  # 移动
  - [钱进, 前进]
  - [前景, 前进]
  - [前镜, 前进]
  - [向钱, 向前]
  - [相前, 向前]
  - [像前, 向前]
  - [项前, 向前]
  - [往钱, 往前]
  - [倒褪, 后退]
  - [倒腿, 后退]
  - [倒退, 后退]
  - [后腿, 后退]
  - [候退, 后退]
  - [厚退, 后退]

  # 转向
  - [作转, 左转]
  - [坐转, 左转]
  - [左传, 左转]
  - [佐转, 左转]
  - [有转, 右转]
  - [又转, 右转]
  - [右传, 右转]
  - [右赚, 右转]

  # 停止/急停
  - [亭下, 停下]
  - [听下, 停下]
  - [停吓, 停下]
  - [停夏, 停下]
  - [吉停, 急停]
  - [急亭, 急停]

  # 演示动作
  - [让圈, 绕圈]
  - [饶圈, 绕圈]
  - [绕权, 绕圈]
  - [花圆, 画圆]
  - [画原, 画圆]
  - [化圆, 画圆]
  - [证方形, 正方形]
  - [正方向, 正方形]
  - [正方行, 正方形]
  - [演示以下, 演示一下]
  - [演示一夏, 演示一下]
  - [展示以下, 展示一下]

  # 导航控制（来自真人 180 秒录音的稳定错词）
  - [取消刀, 取消导航]

  # 会话控制
  - [退出控住, 退出控制]
  - [结束控住, 结束控制]
  - [休民, 休眠]

canonical_phrases:
  - 小智
  - 你好小智
  - 向前
  - 往前
  - 前进
  - 后退
  - 左转
  - 右转
  - 停下
  - 停止
  - 急停
  - 绕圈
  - 画圆
  - 正方形
  - 走正方形
  - 演示一下
  - 展示一下
  - 挥手
  - 把灯设成蓝色
  - 去门口
  - 取消导航
  - 退出控制
  - 结束控制
  - 休眠
